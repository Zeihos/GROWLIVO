name: Verify GROWLIVO source and installer

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Python tooling
        run: python3 -m compileall -q tools
      - name: Verify installer and sources
        run: python3 tools/check_installer.py
      - name: Verify reproducible installer
        run: python3 tools/sync_installer.py --check
